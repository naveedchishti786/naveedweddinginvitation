<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1136" />
      <stop offset="60%" stop-color="#0e071c" />
      <stop offset="100%" stop-color="#05020a" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2b3" />
      <stop offset="25%" stop-color="#e2b755" />
      <stop offset="50%" stop-color="#fef3bf" />
      <stop offset="75%" stop-color="#c99529" />
      <stop offset="100%" stop-color="#f9e27a" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a67c1e" />
      <stop offset="50%" stop-color="#735210" />
      <stop offset="100%" stop-color="#422f08" />
    </linearGradient>

    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="30%" stop-color="#cda344" />
      <stop offset="70%" stop-color="#fff1be" />
      <stop offset="100%" stop-color="#a8791c" />
    </linearGradient>

    <!-- Soft Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="250" cy="250" r="242" fill="url(#bgGrad)" stroke="url(#goldStroke)" stroke-width="3"/>

  <!-- Ornate Outer Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldLight)" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3, 4"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldStroke)" stroke-width="2"/>

  <!-- Decorative Corner Flourishes / Radial Points -->
  <g stroke="url(#goldLight)" stroke-width="1" opacity="0.4">
    <line x1="250" y1="12" x2="250" y2="28" stroke-width="2" />
    <line x1="250" y1="472" x2="250" y2="488" stroke-width="2" />
    <line x1="12" y1="250" x2="28" y2="250" stroke-width="2" />
    <line x1="472" y1="250" x2="488" y2="250" stroke-width="2" />
  </g>

  <!-- Inner Concentric Mandala Ring -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#goldStroke)" stroke-width="1" opacity="0.4"/>
  <circle cx="250" cy="250" r="182" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-dasharray="1.5, 4" opacity="0.7"/>

  <!-- Top Crown / Royal Tiara Crest -->
  <g transform="translate(250, 95)" filter="url(#goldGlow)" text-anchor="middle">
    <!-- Mini Crown Vector -->
    <path d="M -32 25 L -22 6 L 0 16 L 22 6 L 32 25 Z" fill="url(#goldLight)" opacity="0.85" />
    <circle cx="-22" cy="4" r="2.5" fill="#fff" />
    <circle cx="0" cy="13" r="3" fill="#fff" />
    <circle cx="22" cy="4" r="2.5" fill="#fff" />
    <path d="M -34 27 Q 0 30 34 27" fill="none" stroke="url(#goldStroke)" stroke-width="2" />
    <!-- Little Sparkles -->
    <text x="0" y="4" font-family="'Cormorant Garamond', serif" font-size="11" fill="url(#goldLight)" letter-spacing="4">✦ ✦ ✦</text>
  </g>

  <!-- Top Subtitle -->
  <text x="250" y="155" text-anchor="middle" font-family="'Jost', sans-serif" font-weight="300" font-size="11" fill="url(#goldLight)" letter-spacing="0.38em" opacity="0.9">
    ROYAL WEDDING CELEBRATION
  </text>

  <!-- Divider Line Top -->
  <path d="M 170 168 L 220 168 M 280 168 L 330 168" stroke="url(#goldStroke)" stroke-width="1" opacity="0.5"/>
  <polygon points="250,165 253,168 250,171 247,168" fill="url(#goldLight)"/>

  <!-- ══════════════════════════════════════════════
       CENTRAL MONOGRAM: N & A
  ══════════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <!-- Letter N -->
    <text x="178" y="282" text-anchor="middle" font-family="'Cormorant Garamond', 'Cinzel', serif" font-weight="600" font-size="124" fill="url(#goldLight)" letter-spacing="-0.02em">
      N
    </text>

    <!-- Center Ampersand (&) -->
    <text x="250" y="272" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="82" fill="url(#goldLight)" opacity="0.95">
      &amp;
    </text>

    <!-- Letter A -->
    <text x="322" y="282" text-anchor="middle" font-family="'Cormorant Garamond', 'Cinzel', serif" font-weight="600" font-size="124" fill="url(#goldLight)" letter-spacing="-0.02em">
      A
    </text>
  </g>

  <!-- Divider Line Bottom -->
  <path d="M 160 318 L 210 318 M 290 318 L 340 318" stroke="url(#goldStroke)" stroke-width="1" opacity="0.5"/>
  <polygon points="250,315 253,318 250,321 247,318" fill="url(#goldLight)"/>

  <!-- ══════════════════════════════════════════════
       FULL NAMES: NAVEED & ARFA
  ══════════════════════════════════════════════ -->
  <text x="250" y="354" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="600" font-size="24" fill="url(#goldLight)" letter-spacing="0.22em">
    NAVEED &amp; ARFA
  </text>

  <!-- Urdu Nastaliq Inscription -->
  <text x="250" y="388" text-anchor="middle" font-family="'Noto Nastaliq Urdu', serif" font-size="19" fill="url(#goldLight)" opacity="0.85">
    نوید اور عرفہ
  </text>

  <!-- Wedding Year / Dates -->
  <g transform="translate(250, 415)" text-anchor="middle">
    <rect x="-70" y="-12" width="140" height="20" rx="10" fill="url(#goldDark)" opacity="0.4" stroke="url(#goldStroke)" stroke-width="1"/>
    <text x="0" y="2" font-family="'Jost', sans-serif" font-weight="300" font-size="10" fill="url(#goldLight)" letter-spacing="0.28em">
      2026 · 2027
    </text>
  </g>

  <!-- Bottom Stars -->
  <text x="250" y="445" text-anchor="middle" font-size="10" fill="url(#goldLight)" opacity="0.5" letter-spacing="0.4em">
    ✦ · ✦ · ✦
  </text>
</svg>
